name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nothing here is pinned to this repository's own activity: `stable` moves
  # every six weeks, `beta` every day it is rebuilt, and the `rust:*-alpine`
  # base image whenever Alpine ships a fix. Between releases nobody pushes, so
  # a change that breaks the build would sit unseen until the next commit.
  # Once a week, unprompted, is the whole point.
  #
  # Off the hour: scheduled jobs queue behind everyone else's :00 cron.
  #
  # GitHub disables a schedule in a public repository after 60 days without
  # a commit, and mails the owner. A quiet stretch that long is exactly when
  # this matters, so treat that mail as a prompt to re-enable it.
  schedule:
    - cron: '37 6 * * 1'
  # So the schedule's path can be exercised without waiting for Monday.
  workflow_dispatch:

# No job here writes anything back: they build, test and lint a checkout. The
# default token is read-write, so this drops it to what is actually used.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
# Cancel it rather than queue behind it. `github.ref` keeps branches and PRs
# in separate groups, so a push to main never cancels a PR's run.
#
# Not on main, though: commits land there directly, and cancelling would
# leave a commit with no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Plain rustup sets neither; dtolnay/rust-toolchain used to.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # Linux is where this runs; macOS is where it gets developed, and has its
  # own responder (mDNSResponder) sharing port 5353. Windows is left out:
  # nothing here targets it.
  #
  # Linux tests run on musl, the only libc the image ships: the sandbox's
  # syscall allowlist is musl's. Rust carries musl's C runtime with the
  # target, so the runners need nothing installed.
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Through the environment, not interpolated into the scripts.
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update -c clippy -t "$TARGET" && rustup default stable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --target "$TARGET"
      - run: cargo build --release --target "$TARGET"
      # `lint` runs clippy on Linux only, which never compiles the
      # development-platform code (ctrlc signals, if-addrs interfaces).
      - if: runner.os == 'macOS'
        run: cargo clippy --all-targets --target "$TARGET" -- -D warnings

  # `test` above already runs the newest stable. This job is the release that
  # has not happened yet: a regression caught here is six weeks from reaching
  # anyone.
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install beta --profile minimal --no-self-update -t x86_64-unknown-linux-musl && rustup default beta
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --target x86_64-unknown-linux-musl

  # The floor is `rust-version` in the manifest, read from there rather than
  # repeated here: a bump that touched one and not the other would leave this
  # job testing a compiler the manifest no longer admits. The Dockerfile's
  # `rust:<version>-alpine` builds on the same floor, pinned by digest.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: floor
        run: |
          v=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          [ -n "$v" ] || { echo 'no rust-version in Cargo.toml' >&2; exit 1; }
          grep -q "^FROM rust:$v-alpine@sha256:[0-9a-f]\{64\} " Dockerfile \
            || { echo "Dockerfile does not build on a digest-pinned rust:$v-alpine" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update -t x86_64-unknown-linux-musl && rustup default "$TOOLCHAIN"
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.floor.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --target x86_64-unknown-linux-musl

  # The floors in Cargo.toml are a promise: build against exactly these
  # versions and this works. Every other job resolves to the newest compatible
  # release, so none of them exercises one. `-Z direct-minimal-versions` pins
  # every direct dependency to its declared floor and builds that. Nightly
  # because the flag is unstable, and uncached because nightly changes daily.
  minimal_versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --no-self-update -t x86_64-unknown-linux-musl && rustup default nightly
      - run: cargo update -Z direct-minimal-versions
      - run: cargo test --target x86_64-unknown-linux-musl

  # The parser and responder read whatever the LAN sends. A short fuzz per
  # run (parse 60 s, netlink 30 s, responder 30 s) keeps a regression from
  # reaching an image; a crash fails the job and prints the input. Nightly
  # because cargo-fuzz needs sanitizer flags.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --no-self-update && rustup default nightly
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-fuzz@0.13.2
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own
      # target, where the sanitizer cannot link. Name the runner's instead.
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu parse -- -max_total_time=60
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu netlink -- -max_total_time=30
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu responder -- -max_total_time=30

  # The image, on both architectures it will be pulled on, natively rather
  # than under emulation. Then the checks the image itself can answer: that
  # the binary starts in it at all (run with no arguments it prints the usage
  # and exits 1; a missing loader or a dynamic link that slipped in fails
  # differently), and that it carries its dependency list, audited as
  # shipped rather than as the lockfile says.
  docker:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t mdns-alias:ci .
      - run: |
          set +e
          out=$(docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges mdns-alias:ci 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          [ "$code" -eq 1 ] && printf '%s\n' "$out" | grep -q '^mdns-alias: usage:'
      # The image under its own sandbox, on both architectures: it starts,
      # reports seccomp, answers an mDNS query for an alias with an A
      # record, and stops cleanly on SIGTERM as PID 1 (exit 0, goodbyes
      # sent).
      - run: |
          docker run -d --name smoke --network host --read-only --cap-drop ALL \
            mdns-alias:ci ci-smoke.local
          sleep 3
          docker logs smoke
          # Every layer but Landlock, which older runner kernels may lack,
          # must have applied, the capability drop included (unprivileged
          # here, it must leave the unreachable bounding set without
          # failing); "seccomp unavailable" would also match a looser
          # pattern. (`! grep` would not fail the step under -e.)
          docker logs smoke 2>&1 | grep -qE '^mdns-alias: sandbox: .*, seccomp$'
          if docker logs smoke 2>&1 | grep -E 'sandbox: (rlimits|address-space limit|capability drop|non-dumpable|no-new-privs|seccomp) unavailable'; then exit 1; fi
          python3 scripts/mdns-query.py ci-smoke.local
          [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ]
          docker stop smoke > /dev/null
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0 ]
          docker logs smoke 2>&1 | tail -1 | grep -q 'stopped'
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit@0.22.2
      # `cargo audit bin` falls back to guessing from panic messages when the
      # auditable section is missing, so its absence is checked on its own.
      - run: |
          id=$(docker create mdns-alias:ci)
          docker cp "$id:/mdns-alias" mdns-alias
          docker rm "$id" >/dev/null
          readelf -S mdns-alias | grep -q '\.dep-v0' \
            || { echo 'no cargo-auditable data in the binary' >&2; exit 1; }
          cargo audit bin mdns-alias

  # The image against another implementation, Avahi: it resolves the
  # aliases, shares port 5353 with mdns-alias in one network namespace, and
  # the two settle conflicts over a name. Docker only, on a bridge network
  # of its own that the script creates and removes; see its header.
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/interop-test.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update -c rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # The repository is ASCII only. `.githooks/pre-commit` runs the same
      # script, but hooks are per-clone and `--no-verify` skips them, so this
      # is where it is actually enforced.
      - run: scripts/check-ascii.sh
      # Spelling, over the whole tree.
      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
      # A dependency nothing imports.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  # Licenses, duplicate versions and sources, against `deny.toml`. The
  # policy is no copyleft; advisories are `audit.yml`'s.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # The workflows themselves. actionlint reads the YAML against GitHub's
  # schema and runs shellcheck over every script; zizmor is the security
  # half: template injection, an action that is not pinned to a commit, a
  # checkout that leaves its credential on disk, a permission a job does not
  # use. Both are blocking. zizmor runs twice on purpose: the action uploads
  # to code scanning and does not fail the job in that mode; the plain run is
  # the one that fails. Both are online, with a token, since some audits need
  # the API. `.github`, not `.github/workflows`: `dependabot.yml` has audits
  # of its own.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # SC2016 is "expressions don't expand in single quotes": the issue
      # bodies quote markdown code fences in single quotes on purpose.
      - run: actionlint
        env:
          SHELLCHECK_OPTS: -e SC2016
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.29.0
          inputs: .github
          advanced-security: true
      - run: pipx install zizmor==1.29.0
      - run: zizmor --no-progress .github
        env:
          GH_TOKEN: ${{ github.token }}
