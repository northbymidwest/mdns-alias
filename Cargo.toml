[package]
name = "mdns-alias"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "0BSD"
description = "Publish extra mDNS host names for this machine, as CNAMEs of its own"
publish = false

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
# `link-local` keeps fe80:: addresses, often an interface's only IPv6 ones.
if-addrs = { version = "0.15.0", features = ["link-local"] }
# Reports the interface each packet arrived on, keeping `unsafe` out of here.
socket-pktinfo = "0.4.1"
socket2 = "0.6.5"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
