# Fuzz targets, run with `cargo +nightly fuzz run parse`. A separate
# workspace, so the main package's MSRV, `cargo deny` policy and image never
# see libfuzzer.
[package]
name = "mdns-alias-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mdns-alias = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "netlink"
path = "fuzz_targets/netlink.rs"
test = false
doc = false
bench = false

[workspace]
