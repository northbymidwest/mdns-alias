# `cargo deny check licenses bans sources`, in CI's `deny` job. Advisories
# are `audit.yml`, which files an issue; this is the policy the tree must
# satisfy on every push.

[graph]
all-features = false

# No copyleft enters the tree. The crate is 0BSD, and anyone building the
# binary or the image should inherit nothing they did not choose. A new
# dependency under another license fails here rather than being noticed later.
[licenses]
allow = ["0BSD", "MIT", "Apache-2.0"]
unused-allowed-license = "deny"

[bans]
# Two versions of one crate in a tree this small is a dependency that drifted.
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
